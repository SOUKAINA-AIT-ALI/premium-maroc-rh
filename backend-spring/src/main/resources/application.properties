spring.application.name=premium-rh-api
server.port=8080

# Base MariaDB fournie par XAMPP.
spring.datasource.url=${DB_URL:jdbc:mariadb://127.0.0.1:3306/premium_rh}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.community.dialect.MariaDBLegacyDialect

spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=4MB
app.evaluations.deadline-cron=0 0 8 * * *
app.seed.enabled=true

# Envoi automatique des fiches d'évaluation. En production, activer MAIL_ENABLED
# et fournir SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME et
# SPRING_MAIL_PASSWORD selon le serveur SMTP de l'entreprise.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@premium.ma}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Si JWT_SECRET est absent, une clé aléatoire est générée au démarrage (les tokens
# deviennent alors invalides au prochain redémarrage). Définir JWT_SECRET en production.
app.security.jwt-secret=${JWT_SECRET:}
app.security.jwt-ttl=${JWT_TTL:PT8H}
